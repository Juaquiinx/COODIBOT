version: '3.8'

services:
  backend:
    build: ./backend
    container_name: coodibot_backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
    restart: always

  frontend:
    build: ./frontend
    container_name: coodibot_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
